<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Love ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 360px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      color: #ff4b6e;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    button {
      background: #ff4b6e;
      border: none;
      color: white;
      padding: 10px 22px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
    }

    button:hover {
      background: #ff1e4d;
      transform: scale(1.05);
    }

    #hidden-love {
      display: none;
      margin-top: 20px;
      color: #ff4b6e;
      font-weight: bold;
    }

    .heart {
      position: fixed;
      color: #ff4b6e;
      font-size: 20px;
      animation: floatUp 4s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) scale(0.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>💖 My Love 💖</h1>
    <p>
      You are my today,<br>
      my tomorrow,<br>
      and every heartbeat in between.
    </p>

    <button onclick="showLove()">Tap for More Love 💌</button>

    <div id="hidden-love">
      <p>
        No matter where life takes us,<br>
        my heart will always choose you 🧿❤️✨
      </p>
    </div>
  </div>

  <script>
    function showLove() {
      document.getElementById("hidden-love").style.display = "block";
      createHearts();
    }

    function createHearts() {
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (2 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 4000);
      }
    }
  </script>

</body>
</html>
